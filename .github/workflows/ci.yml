name: CI Workflow

on:
  workflow_call:
    inputs:
      stack:
        required: true
        type: string
        description: "CDK stack environment suffix (dev or production)"
      environment:
        required: true
        type: string
        description: "GitHub environment name (dev or production)"
      run-deploy:
        required: false
        type: boolean
        default: true
        description: "Whether to run deployment step"
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test
      - run: npx prettier . --check
      - run: npx eslint .
      - run: npx tsc --noEmit

  cdk-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: cd cdk && npm ci
      - run: cd cdk && npx tsc --noEmit
      - run: cd cdk && npx cdk synth --all

  infra:
    runs-on: ubuntu-latest
    needs: [cdk-checks]
    outputs:
      distributionId: ${{ steps.cdk-outputs.outputs.distributionId }}
      siteUrl: ${{ steps.cdk-outputs.outputs.siteUrl }}
      s3BucketUri: ${{ steps.cdk-outputs.outputs.s3BucketUri }}
      apiUrl: ${{ steps.cdk-outputs.outputs.apiUrl }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: cd cdk && npm ci
      - name: Deploy infrastructure
        run: cd cdk && npx cdk deploy phone-numbers-web-${{ inputs.stack }} --require-approval never
      - id: cdk-outputs
        run: |
          STACK_NAME=phone-numbers-web-${{ inputs.stack }}
          DISTRIBUTION_ID=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" --output text)
          SITE_URL=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" --query "Stacks[0].Outputs[?OutputKey=='SiteUrl'].OutputValue" --output text)
          S3_BUCKET_URI=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" --query "Stacks[0].Outputs[?OutputKey=='S3BucketUri'].OutputValue" --output text)
          API_URL=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text)
          echo "distributionId=$DISTRIBUTION_ID" >> $GITHUB_OUTPUT
          echo "siteUrl=$SITE_URL" >> $GITHUB_OUTPUT
          echo "s3BucketUri=$S3_BUCKET_URI" >> $GITHUB_OUTPUT
          echo "apiUrl=$API_URL" >> $GITHUB_OUTPUT
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: "us-west-2"

  build:
    runs-on: ubuntu-latest
    needs: [test, infra]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ needs.infra.outputs.apiUrl }}
      - run: zip -r build.zip out/*
      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ inputs.stack }}
          path: build.zip

  smoke-test:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v8
        with:
          name: build-${{ inputs.stack }}
      - run: unzip build.zip
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ inputs.stack }}
          path: playwright-report/
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: [test, infra, build, smoke-test]
    if: ${{ inputs.run-deploy }}
    environment: ${{ inputs.environment }}
    outputs:
      invalidationId: ${{ steps.invalidate.outputs.invalidationId }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: build-${{ inputs.stack }}
      - run: unzip build.zip
      - run: pip install awscli
      - run: aws s3 sync --acl public-read --delete ./out ${{ needs.infra.outputs.s3BucketUri }}
      - run: aws configure set preview.cloudfront true
      - id: invalidate
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation --distribution-id ${{ needs.infra.outputs.distributionId }} --paths '/*' --query 'Invalidation.Id' --output text)
          echo "invalidationId=$INVALIDATION_ID" >> $GITHUB_OUTPUT
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  post-deploy-check:
    runs-on: ubuntu-latest
    needs: [infra, deploy]
    steps:
      - name: Wait for CloudFront invalidation to complete
        run: |
          for i in $(seq 1 30); do
            STATUS=$(aws cloudfront get-invalidation --distribution-id "${{ needs.infra.outputs.distributionId }}" --id "${{ needs.deploy.outputs.invalidationId }}" --query 'Invalidation.Status' --output text)
            echo "Invalidation status: $STATUS"
            if [ "$STATUS" = "Completed" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "Invalidation did not complete within 5 minutes"
          exit 1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Check the live site responds correctly
        run: |
          set -e
          SITE_URL="${{ needs.infra.outputs.siteUrl }}"
          body=$(curl -fsS --retry 5 --retry-delay 5 "$SITE_URL/")
          if ! echo "$body" | grep -qF "Phone Numbers"; then
            echo "FAIL: $SITE_URL/ did not contain 'Phone Numbers'"
            exit 1
          fi
          echo "OK: $SITE_URL/ contains 'Phone Numbers'"
      - name: Check the API the site was built against responds
        run: |
          set -e
          API_URL="${{ needs.infra.outputs.apiUrl }}"
          body=$(curl -fsS --retry 5 --retry-delay 5 "$API_URL/match?value=1800837863")
          if ! echo "$body" | grep -qF '"match"'; then
            echo "FAIL: $API_URL/match did not return a match: $body"
            exit 1
          fi
          echo "OK: $API_URL/match returned $body"
